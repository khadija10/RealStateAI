# =============================================================================
# Configuration unique du pipeline.
# RÈGLE : aucun seuil, aucun chemin, aucun code département en dur dans le code.
# Tout ce qui est discutable en soutenance doit être visible ici.
# =============================================================================

projet: RealStateAI

perimetre:
  libelle: "Île-de-France (8 départements)"
  departements: ["75", "77", "78", "91", "92", "93", "94", "95"]
  # Millésimes disponibles : de 2014 à l'avant-dernière année environ.
  # La DGFiP publie en avril et octobre, avec un décalage : l'année en cours
  # n'est jamais disponible. Un millésime absent est signalé et ignoré,
  # le pipeline continue avec les autres.
  millesimes: [2021, 2022, 2023, 2024, 2025]

chemins:
  raw: "data/raw"              # bronze  : .csv.gz tels que téléchargés
  interim: "data/interim"      # silver  : nettoyé, dédoublonné, typé
  processed: "data/processed"  # gold    : ML-ready, Parquet
  external: "data/external"    # référentiels INSEE, BAN...
  samples: "data/samples"      # échantillon versionné pour les tests/CI

ingestion:
  base_url: "https://files.data.gouv.fr/geo-dvf/latest/csv"
  timeout_s: 60
  max_retries: 5
  backoff_s: 3                 # attente exponentielle entre deux tentatives

execution:
  moteur: "duckdb"
  memory_limit: "4GB"          # < 8 Go de RAM machine : DuckDB spille sur disque
  threads: 4

# --- Paramètres de nettoyage : valeurs de départ, à justifier à l'étape 3 ----
nettoyage:
  natures_mutation_gardees:
    - "Vente"
    - "Vente en l'état futur d'achèvement"
  codes_type_local_gardes: [1, 2]     # 1 = Maison, 2 = Appartement
  surface_bati_min_m2: 9              # seuil de décence (loi Carrez / logement)
  # Cohérence surface / pièces. En dessous de ce ratio, la source a recopié
  # la surface dans le champ "nombre de pièces" : on neutralise le champ
  # (NULL) sans supprimer la mutation, dont le prix reste valide.
  m2_min_par_piece: 8
  # Contrôle de cohérence géographique. Des coordonnées fausses sont publiées
  # telles quelles par la source sur une poignée de communes : on vérifie que
  # chaque point est à portée du centroïde de son propre département.
  geo:
    lat_min: 41.0                     # bornes de la France métropolitaine
    lat_max: 51.5
    lon_min: -5.5
    lon_max: 9.8
    tolerance_degres: 1.5             # ~165 km autour du centroïde départemental
  outliers:
    # Règle retenue après calibrage sur l'Île-de-France (cf. docs/cleaning_rules.md) :
    # le prix au m² doit rester dans une fourchette relative à la médiane de sa
    # propre commune. S'adapte seule au territoire, contrairement à un seuil absolu.
    methode: "ratio_mediane_zone"     # alternatives : quantiles_par_zone, iqr
    ratio_min: 0.25                   # en dessous : nue-propriété, viager, cession familiale
    ratio_max: 4.0                    # au-dessus : valeur foncière couvrant plusieurs biens
    prix_m2_plancher: 300             # garde-fou absolu : ventes à l'euro symbolique
    prix_m2_plafond: 30000            # garde-fou absolu : erreurs de saisie

# --- Seuils du contrôle qualité : la commande `pipeline qualite` échoue ------
# si l'un d'eux est franchi, et renvoie un code de sortie non nul (CI).
qualite:
  taux_nuls_max_prix_m2: 0.02         # nuls tolérés sur prix_m2_reference_12m
  perte_lignes_max_nettoyage: 0.60    # alerte si le nettoyage retire > 60 %
  prix_m2_median_min: 1000            # plausibilité : une médiane hors de cette
  prix_m2_median_max: 20000           # plage signale une déduplication cassée

# --- Enrichissement DPE (ADEME) -----------------------------------------------
# Source : jeu "DPE Logements existants (depuis juillet 2021)", dpe03existant.
# API libre, sans clé, limitée à 10 appels par seconde.
enrichissement:
  dpe_api: "https://data.ademe.fr/data-fair/api/v1/datasets/dpe03existant/lines"
  dpe_taille_page: 5000
  # L'API n'accepte de filtrer que par listes de valeurs (code_postal_ban_in).
  # Nombre de codes postaux par lot. C'est aussi la GRANULARITÉ DE REPRISE :
  # chaque lot est écrit sur disque dès qu'il est terminé. Une valeur basse
  # rend le téléchargement interruptible à tout moment sans rien perdre.
  dpe_codes_par_requete: 2
  dpe_pause_s: 0.15                 # garde une marge sous la limite de 10 appels/s
  # Écart relatif maximal entre surface vendue (DVF) et surface habitable (DPE)
  # pour considérer qu'il s'agit du même logement. Les deux mesures ne sont
  # pas strictement identiques : 10 % absorbe cette différence sans
  # confondre deux appartements voisins de tailles différentes.
  dpe_tolerance_surface: 0.10
  # En dessous de ce nombre de DPE, la part de passoires d'un code postal
  # n'est pas assez fiable pour servir d'indicateur.
  dpe_min_diagnostics_zone: 30

  # --- Enrichissement IRIS (INSEE) ---------------------------------------------
  # IRIS = découpage infra-communal de l'INSEE (~48 000 zones de ~2 000
  # habitants), plus fin que la commune/l'arrondissement déjà utilisés pour les
  # features de marché. Comble en partie l'absence de variables de quartier
  # dans DVF (cf. docs/data_dictionary.md), via deux sources ouvertes :
  #
  #   1. contours géographiques (IGN, GeoPackage, projection Lambert-93) ;
  #   2. statistiques socio-démographiques par code IRIS (INSEE).
  #
  # ATTENTION : comme pour le DPE, les URLs et noms de colonnes INSEE/IGN
  # dérivent d'un millésime de publication à l'autre. Les valeurs ci-dessous
  # sont celles du millésime 2021 (le plus récent disponible à l'écriture de
  # cette configuration) : vérifier avec `pipeline iris-diagnostic` avant tout
  # téléchargement en masse si une nouvelle publication est sortie.
  iris_contours_url: "https://data.geopf.fr/telechargement/download/CONTOURS-IRIS/CONTOURS-IRIS_3-0__GPKG_LAMB93_FXX_2024-01-01/CONTOURS-IRIS_3-0__GPKG_LAMB93_FXX_2024-01-01.7z"
  iris_contours_crs: "EPSG:2154"          # Lambert-93 : projection des contours IGN
  # Nom réel observé dans CONTOURS-IRIS_3-0 (IGN) : "code_iris", en minuscules —
  # confirmé par `pipeline iris-diagnostic`, qui vérifie aussi la colonne de
  # géométrie (son nom varie, "geometrie" sur ce produit ; enrichir_iris la
  # détecte automatiquement plutôt que de la coder en dur).
  iris_code_colonne: "code_iris"

  iris_filosofi_url: "https://www.insee.fr/fr/statistiques/fichier/8229323/BASE_TD_FILO_IRIS_2021_DISP_CSV.zip"
  iris_filosofi_millesime: 21             # suffixe des colonnes INSEE, ex. DISP_MED21
  iris_logement_url: "https://www.insee.fr/fr/statistiques/fichier/8268838/base-ic-logement-2021_csv.zip"
  iris_logement_millesime: 21             # suffixe des colonnes INSEE, ex. P21_LOG

  # En dessous de ce nombre de ménages, une statistique IRIS est trop fragile
  # pour être publiée (le secret statistique INSEE masque déjà les plus
  # petits IRIS ; ce seuil ajoute une marge de sécurité pour l'équipe ML).
  iris_min_menages_zone: 50
