# =============================================================================
# Configuration unique du pipeline.
# RÈGLE : aucun seuil, aucun chemin, aucun code département en dur dans le code.
# Tout ce qui est discutable en soutenance doit être visible ici.
# =============================================================================

projet: RealStateAI

perimetre:
  libelle: "Île-de-France (8 départements)"
  departements: ["75", "77", "78", "91", "92", "93", "94", "95"]
  # À CONFIRMER à l'étape 1 : le script d'ingestion listera les millésimes
  # réellement publiés sur files.data.gouv.fr avant de figer cette liste.
  millesimes: [2021, 2022, 2023, 2024, 2025]

chemins:
  raw: "data/raw"              # bronze  : .csv.gz tels que téléchargés
  interim: "data/interim"      # silver  : nettoyé, dédoublonné, typé
  processed: "data/processed"  # gold    : ML-ready, Parquet
  external: "data/external"    # référentiels INSEE, BAN...
  samples: "data/samples"      # échantillon versionné pour les tests/CI

ingestion:
  base_url: "https://files.data.gouv.fr/geo-dvf/latest/csv"
  timeout_s: 60
  max_retries: 5
  backoff_s: 3                 # attente exponentielle entre deux tentatives

execution:
  moteur: "duckdb"
  memory_limit: "4GB"          # < 8 Go de RAM machine : DuckDB spille sur disque
  threads: 4

# --- Paramètres de nettoyage : valeurs de départ, à justifier à l'étape 3 ----
nettoyage:
  natures_mutation_gardees:
    - "Vente"
    - "Vente en l'état futur d'achèvement"
  codes_type_local_gardes: [1, 2]     # 1 = Maison, 2 = Appartement
  surface_bati_min_m2: 9              # seuil de décence (loi Carrez / logement)
  outliers:
    # Règle retenue après calibrage sur l'Île-de-France (cf. docs/cleaning_rules.md) :
    # le prix au m² doit rester dans une fourchette relative à la médiane de sa
    # propre commune. S'adapte seule au territoire, contrairement à un seuil absolu.
    methode: "ratio_mediane_zone"     # alternatives : quantiles_par_zone, iqr
    ratio_min: 0.25                   # en dessous : nue-propriété, viager, cession familiale
    ratio_max: 4.0                    # au-dessus : valeur foncière couvrant plusieurs biens
    prix_m2_plancher: 300             # garde-fou absolu : ventes à l'euro symbolique
    prix_m2_plafond: 30000            # garde-fou absolu : erreurs de saisie

qualite:
  taux_nuls_max_prix_m2: 0.02         # au-delà, la CI échoue
  perte_lignes_max_nettoyage: 0.60    # alerte si le nettoyage retire > 60 %
