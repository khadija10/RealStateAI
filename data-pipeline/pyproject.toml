[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realstate-data"
version = "0.1.0"
description = "Pipeline d'ingestion, nettoyage et préparation des données DVF pour RealStateAI"
requires-python = ">=3.11"

dependencies = [
    "pandas==2.2.3",          # manipulation finale, interface avec l'équipe ML
    "duckdb==1.1.3",          # moteur out-of-core : agrégations sur > RAM
    "pyarrow==18.1.0",        # lecture/écriture Parquet (couches silver et gold)
    "requests==2.32.3",       # téléchargement DVF
    "tqdm==4.67.1",           # barres de progression sur les téléchargements
    "PyYAML==6.0.2",          # lecture de config/settings.yaml
    "pandera==0.21.0",        # validation de schéma (étape 6)
    "python-dotenv==1.0.1",   # lecture du .env
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
    "nbstripout==0.8.1",      # vide les sorties de notebooks avant commit
    "jupyterlab==4.3.4",
    "matplotlib==3.10.0",     # profiling visuel (étape 2)
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
