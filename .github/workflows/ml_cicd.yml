name: CI/CD — Modèle ML + Déploiement

on:
  push:
    branches: [main, feature/ml-mlops]
  workflow_dispatch:

env:
  IMAGE_NAME: khdj0/realestateai-backend
  IMAGE_TAG: v1.4.2

jobs:
  # ── 1. Tests backend ────────────────────────────────────────────────────────
  test-backend:
    name: Tests backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r ../requirements.txt

      - name: Lancer pytest
        run: pytest tests/ -v --tb=short

  # ── 2. Régression modèle ML ─────────────────────────────────────────────────
  test-model-regression:
    name: Régression modèle ML (MAPE gate)
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances ML
        run: pip install -r requirements.txt

      - name: Vérification modèle (gate MAPE < 25 %)
        run: python ml/tests/test_regression_model.py
        env:
          MODEL_PATH: Backend/models/price_model.pkl

  # ── 3. Build Docker — fait en local (modèles .pkl non versionnés) ────────────
  # L'image de production est construite localement (où les .pkl existent),
  # puis poussée manuellement sur Docker Hub. Render tire cette image via
  # runtime: image dans render.yaml. Le CI ne peut pas reconstruire l'image
  # car les fichiers modèles sont dans .gitignore.
