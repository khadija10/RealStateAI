[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realstate-financement"
version = "0.1.0"
description = "Moteur de règles de financement immobilier — RealStateAI"
requires-python = ">=3.11"

dependencies = [
    "PyYAML>=6.0",            # lecture de config/bareme.yaml
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8", "httpx>=0.27"]
agent = ["openai>=1.50", "python-dotenv>=1.0"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
