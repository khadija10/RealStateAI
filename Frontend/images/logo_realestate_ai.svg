    <line x1="306" y1="120" x2="311" y2="120" stroke="#d4793f" stroke-width="2" stroke-linecap="round"/>
    <line x1="289" y1="111" x2="293" y2="115" stroke="#d4793f" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="303" y1="125" x2="307" y2="129" stroke="#d4793f" stroke-width="1.5" stroke-linecap="round"/>
