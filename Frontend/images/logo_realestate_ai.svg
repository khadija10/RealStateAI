  <!-- AI SPARK -->
  <g filter="url(#glow)" opacity="0.92">
    <circle cx="298" cy="120" r="18" fill="rgba(181,97,42,0.13)" stroke="rgba(181,97,42,0.45)" stroke-width="1.2"/>
    <line x1="298" y1="107" x2="298" y2="112" stroke="#d4793f" stroke-width="2" stroke-linecap="round"/>
