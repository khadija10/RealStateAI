    <rect x="183" y="291" width="14" height="14" rx="1" fill="rgba(181,97,42,0.14)" stroke="rgba(181,97,42,0.3)" stroke-width="0.8"/>
    <rect x="203" y="291" width="14" height="14" rx="1" fill="rgba(181,97,42,0.14)" stroke="rgba(181,97,42,0.3)" stroke-width="0.8"/>
    <rect x="183" y="306" width="14" height="10" rx="1" fill="rgba(181,97,42,0.1)" stroke="rgba(181,97,42,0.25)" stroke-width="0.8"/>
    <rect x="203" y="306" width="14" height="10" rx="1" fill="rgba(181,97,42,0.1)" stroke="rgba(181,97,42,0.25)" stroke-width="0.8"/>
    <circle cx="199" cy="301" r="1.8" fill="url(#copperGrad)"/>
    <circle cx="201" cy="301" r="1.8" fill="url(#copperGrad)"/>
    <path d="M195 282 L200 276 L205 282 Z" fill="url(#copperGrad)"/>

