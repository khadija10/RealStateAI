<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1a16;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0d0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4793f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8f4418;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="stoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0ebe3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4ccc0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c9853a;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#b5612a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7a3d16;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.5)"/>
    </filter>
    <clipPath id="circleClip">
      <circle cx="200" cy="200" r="185"/>
    </clipPath>
  </defs>

  <!-- BACKGROUND -->
  <circle cx="200" cy="200" r="200" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="185" fill="none" stroke="rgba(181,97,42,0.25)" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="178" fill="none" stroke="rgba(181,97,42,0.08)" stroke-width="1"/>

  <!-- BUILDING SHADOW -->
  <ellipse cx="200" cy="318" rx="86" ry="9" fill="rgba(0,0,0,0.4)"/>

