    <rect x="124" y="253" width="28" height="22" rx="2" fill="rgba(12,10,8,0.82)" stroke="rgba(181,97,42,0.35)" stroke-width="1"/>
    <rect x="126" y="255" width="11" height="18" rx="1" fill="rgba(212,121,63,0.1)"/>
    <rect x="139" y="255" width="11" height="18" rx="1" fill="rgba(212,121,63,0.1)"/>

    <rect x="172" y="253" width="28" height="22" rx="2" fill="rgba(12,10,8,0.82)" stroke="rgba(181,97,42,0.35)" stroke-width="1"/>
    <rect x="174" y="255" width="11" height="18" rx="1" fill="rgba(212,121,63,0.1)"/>
