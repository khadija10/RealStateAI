    <rect x="153" y="155" width="9" height="13" rx="1" fill="rgba(212,121,63,0.15)"/>

    <rect x="188" y="135" width="24" height="17" rx="2" fill="rgba(12,10,8,0.92)" stroke="rgba(181,97,42,0.55)" stroke-width="1.2"/>
    <rect x="190" y="137" width="9" height="13" rx="1" fill="rgba(212,121,63,0.22)"/>
