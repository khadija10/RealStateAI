services:
  - type: web
    name: realestateai-backend
    env: docker
    plan: free
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGINS
        value: '["https://realestateai-frontend.onrender.com","http://localhost:5173","http://127.0.0.1:5173"]'
      - key: DATABASE_URL
        fromDatabase:
          name: realestateai-db
          property: connectionString

  - type: web
    name: realestateai-frontend
    env: docker
    plan: free
    dockerfilePath: ./Frontend/Dockerfile
    dockerContext: .
    envVars:
      - key: VITE_API_URL
        value: https://realestateai-backend.onrender.com

databases:
  - name: realestateai-db
    databaseName: realestate_ai
    user: realestate_user
    plan: free