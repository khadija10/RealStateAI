# Render.com — Infrastructure as Code
# Doc : https://render.com/docs/blueprint-spec

services:
  # ── Backend FastAPI ───────────────────────────────────────────────────────
  - type: web
    name: realestateai-backend
    env: docker
    plan: free
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ALLOW_MOCK_FALLBACK
        value: "true"
      - key: LOG_LEVEL
        value: WARNING
      - key: CORS_ORIGINS
        value: '["https://realestateai-frontend.onrender.com","http://localhost:5173","http://127.0.0.1:5173"]'
      - key: DATABASE_URL
        fromDatabase:
          name: realestateai-db
          property: connectionString

  # ── Frontend React ────────────────────────────────────────────────────────
  - type: web
    name: realestateai-frontend
    runtime: static
    rootDir: Frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://realestateai-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ── Base de données PostgreSQL ────────────────────────────────────────────
databases:
  - name: realestateai-db
    databaseName: realestate_ai
    user: realestate_user
    plan: free
