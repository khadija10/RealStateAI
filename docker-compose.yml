services:
  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    container_name: realestate_backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: realestate_frontend
    ports:
      - "8501:80"
    depends_on:
      - backend
    restart: unless-stopped
