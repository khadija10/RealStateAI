services:

  # ── Backend FastAPI ──────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    container_name: reai_backend
    ports:
      - "8000:8000"
    environment:
      JWT_SECRET: ${JWT_SECRET:-realestateai-dev-secret-change-in-production}
      DATABASE_URL: sqlite:////app/data/search_history.db
    volumes:
      # Modèle ML monté en volume pour éviter de rebaker l'image à chaque entraînement
      - ./Backend/models:/app/models
      # Persistance SQLite — seul /app/data est monté pour ne pas figer le code de l'image
      - backend_data:/app/data
    restart: unless-stopped

  # ── Frontend React/Nginx ─────────────────────────────────────────────────
  frontend:
    build:
      context: Frontend
      dockerfile: Dockerfile
      args:
        # Le navigateur appelle le backend directement sur localhost:8000
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: reai_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
